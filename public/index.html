<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timesheet Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>Timesheet Login</h1>
      <p>Sign in with your company account.</p>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="username" placeholder="you@company.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn" id="loginBtn" style="width:100%">Log in</button>
      <div class="error-msg" id="err"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('err');
      errEl.textContent = '';
      if (!email || !password) {
        errEl.textContent = 'Please enter your email and password.';
        return;
      }
      try {
        const { user } = await Api.post('/api/auth/login', { email, password });
        window.location.href = user.role === 'admin' ? '/admin.html' : '/employee.html';
      } catch (e) {
        errEl.textContent = e.message;
      }
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    // If already logged in, skip straight to the right dashboard.
    (async () => {
      try {
        const { user } = await Api.get('/api/auth/me');
        window.location.href = user.role === 'admin' ? '/admin.html' : '/employee.html';
      } catch (e) { /* not logged in, stay here */ }
    })();
  </script>
</body>
</html>
