<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password recovery · FWA</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="login-card"><h1>Password recovery</h1>
<form id="recoveryForm"><div class="field" id="emailField"><label for="email">Work email</label><input type="email" id="email" autocomplete="username"></div>
<div class="field" id="passwordField" hidden><label for="newPassword">New password (12+ characters, at most 72 UTF-8 bytes)</label><input type="password" id="newPassword" autocomplete="new-password" minlength="12"></div>
<button class="btn" type="submit" id="submit">Send recovery instructions</button></form>
<p id="message" role="status"></p><a href="/index.html">Return to sign in</a></main>
<script src="/js/api.js"></script><script src="/js/reset-password.js"></script></body></html>
